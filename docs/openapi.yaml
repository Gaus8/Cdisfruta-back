      summary: Exportar Inventario al Catálogo
      description: >-
        ## Descripción


        Pasa artículos de inventario al catálogo como borrador. Todavía no quedan publicados en la tienda.


        Requiere la cookie `access_token`. En Postman se guarda sola al ejecutar **Login Usuario** o **Ingreso con
        Google** contra el mismo `{{baseUrl}}`. También se acepta el header `Authorization: Bearer <jwt>`. El rol de la
        cuenta debe ser `admin`.


        ## Body - Parámetros de entrada


        | Campo | Tipo | Obligatorio | Descripción |

        | --- | --- | --- | --- |

        | ids | String[] | Sí | IDs de artículos activos que aún no están en el catálogo. |
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                ids:
                  - '{{productoId}}'
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /api/pedidos:
    post:
      tags:
        - pedidos
      summary: Crear Pedido
      description: >-
        ## Descripción


        Registra un pedido y descuenta el stock. Si hay sesión, el pedido queda asociado a esa cuenta. Si no hay sesión,
        el correo del envío es obligatorio y la respuesta incluye `guestClaimToken` para vincularlo después. `NEQUI` y
        `CARD` preparan el checkout de Wompi.


        ## Body - Parámetros de entrada


        | Campo | Tipo | Obligatorio | Descripción |

        | --- | --- | --- | --- |

        | metodoPago | String | No | `Contraentrega`, `NEQUI` o `CARD`. Si falta, queda contraentrega. |

        | productos | Objeto[] | Sí | De 1 a 50 líneas. Cada una lleva `productoId` y `cantidad` entera entre 1 y 1000.
        |

        | datosEnvio.nombres | String | Sí | Nombre de quien recibe. |

        | datosEnvio.apellidos | String | Sí | Apellidos de quien recibe. |

        | datosEnvio.whatsapp | String | Sí | Teléfono de contacto. |

        | datosEnvio.correo | String | Invitado | Obligatorio si no hay sesión. Debe coincidir para reclamar el pedido.
        |

        | datosEnvio.departamento | String | Sí | Departamento de entrega. |

        | datosEnvio.municipio | String | Sí | Municipio de entrega. |

        | datosEnvio.direccion | String | Sí | Dirección. |

        | datosEnvio.barrio | String | Sí | Barrio. |


        ## Respuesta


        `201` con el pedido. `409` si un producto no está en la tienda o no hay stock.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                metodoPago: Contraentrega
                productos:
                  - productoId: '{{productoId}}'
                    cantidad: 2
                datosEnvio:
                  nombres: Ana
                  apellidos: Pérez
                  whatsapp: '3001234567'
                  correo: comprador@ejemplo.com
                  departamento: Cundinamarca
                  municipio: Ubaté
                  direccion: 'Calle 10 # 5-20'
                  barrio: Centro
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      security: []
  /api/pedidos/mis-pedidos:
    get:
      tags:
        - pedidos
      summary: Mis Pedidos
      description: >-
        ## Descripción


        Lista los pedidos de la cuenta autenticada, del más reciente al más antiguo.


        Requiere la cookie `access_token`. En Postman se guarda sola al ejecutar **Login Usuario** o **Ingreso con
        Google** contra el mismo `{{baseUrl}}`. También se acepta el header `Authorization: Bearer <jwt>`.
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /api/pedidos/{pedidoId}/estado:
    patch:
      tags:
        - pedidos
      summary: Cancelar Mi Pedido
      description: >-
        ## Descripción


        El dueño cancela su propio pedido solo si sigue en `Pendiente`. Devuelve el stock una sola vez.


        Requiere la cookie `access_token`. En Postman se guarda sola al ejecutar **Login Usuario** o **Ingreso con
        Google** contra el mismo `{{baseUrl}}`. También se acepta el header `Authorization: Bearer <jwt>`.


        ## Body - Parámetros de entrada


        | Campo | Tipo | Obligatorio | Descripción |

        | --- | --- | --- | --- |

        | motivo | String | Sí | Motivo de 1 a 300 caracteres. |

        | estado | String | No | Si se envía, solo se acepta `Cancelado`. |
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                motivo: Ya no puedo recibirlo
      parameters:
        - name: pedidoId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /api/pedidos/reclamar:
    post:
      tags:
        - pedidos
      summary: Reclamar Pedido de Invitado
      description: >-
        ## Descripción


        Asocia a la cuenta verificada un pedido hecho como invitado. El correo de la cuenta debe ser el del envío.


        Requiere la cookie `access_token`. En Postman se guarda sola al ejecutar **Login Usuario** o **Ingreso con
        Google** contra el mismo `{{baseUrl}}`. También se acepta el header `Authorization: Bearer <jwt>`. Rol `user`
        verificado.


        ## Body - Parámetros de entrada


        | Campo | Tipo | Obligatorio | Descripción |

        | --- | --- | --- | --- |

        | claimToken | String | Sí | Token devuelto al crear el pedido. Entre 40 y 100 caracteres. |
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                claimToken: TOKEN_DE_PEDIDO_INVITADO
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /api/pedidos/estado-pago:
    get:
      tags:
        - pedidos
      summary: Consultar Estado de Pago
      description: |-
        ## Descripción

        Consulta en Wompi el resultado de un pago y actualiza el pedido si la transacción corresponde.

        ## Query

        | Campo | Ejemplo | Descripción |
        | --- | --- | --- |
        | reference | CDIS123 | Referencia de pago del pedido. |
        | id | ID_TRANSACCION_WOMPI | ID de la transacción en Wompi. |
      parameters:
        - name: reference
          in: query
          schema:
            type: string
          description: Referencia de pago del pedido.
          example: CDIS123
        - name: id
          in: query
          schema:
            type: string
          description: ID de la transacción en Wompi.
          example: ID_TRANSACCION_WOMPI
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      security: []
  /api/pagos/wompi/webhook:
    post:
      tags:
        - pedidos
      summary: Webhook Wompi
      description: >-
        ## Descripción


        Lo llama Wompi cuando cambia una transacción. Valida la firma con el secreto de eventos. No está pensado para
        enviarse a mano: sin la firma correcta responde `400` o `401`.


        ## Body - Parámetros de entrada


        | Campo | Tipo | Obligatorio | Descripción |

        | --- | --- | --- | --- |

        | event | String | Sí | Debe ser `transaction.updated`. |

        | data.transaction | Objeto | Sí | Transacción de Wompi, incluida la referencia del pedido. |

        | signature | Objeto | Sí | Propiedades firmadas y checksum. |

        | timestamp | Number | Sí | Marca de tiempo incluida en la firma. |

        | environment | String | En producción | En producción debe ser `prod`. |
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                event: transaction.updated
                data:
                  transaction:
                    reference: CDIS123
                    status: APPROVED
                    id: ID_TRANSACCION
                signature:
                  properties:
                    - transaction.id
                    - transaction.status
                    - transaction.amount_in_cents
                  checksum: CHECKSUM
                timestamp: 1710000000
                environment: test
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      security: []
  /api/admin/pedidos:
    get:
      tags:
        - pedidos
      summary: Listar Todos los Pedidos
      description: >-
        ## Descripción


        Devuelve todos los pedidos con el nombre y el correo del cliente.


        Requiere la cookie `access_token`. En Postman se guarda sola al ejecutar **Login Usuario** o **Ingreso con
        Google** contra el mismo `{{baseUrl}}`. También se acepta el header `Authorization: Bearer <jwt>`. El rol de la
