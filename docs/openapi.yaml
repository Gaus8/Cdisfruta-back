        | notificarPedidos | Boolean | Sí | Avisos de pedidos. |

        | notificarInventario | Boolean | Sí | Avisos de inventario. |

        | notificarCatalogo | Boolean | Sí | Avisos de catálogo. |

        | umbralStockCritico | Number | Sí | Entero de 0 a 10000. |
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                notificarPedidos: true
                notificarInventario: true
                notificarCatalogo: true
                umbralStockCritico: 5
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /api/auth/admin/analitica-productos:
    get:
      tags:
        - admin
      summary: Analítica de Productos
      description: >-
        ## Descripción


        Resume pedidos, unidades, ingresos, visitas e interés por producto.


        Requiere la cookie `access_token`. En Postman se guarda sola al ejecutar **Login Usuario** o **Ingreso con
        Google** contra el mismo `{{baseUrl}}`. También se acepta el header `Authorization: Bearer <jwt>`. El rol de la
        cuenta debe ser `admin`.
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /api/auth/actividad:
    post:
      tags:
        - admin
      summary: Registrar Actividad
      description: >-
        ## Descripción


        Registra una visita o un intento de formulario del cliente. Hay un máximo de 120 eventos por hora.


        Requiere la cookie `access_token`. En Postman se guarda sola al ejecutar **Login Usuario** o **Ingreso con
        Google** contra el mismo `{{baseUrl}}`. También se acepta el header `Authorization: Bearer <jwt>`. Solo rol
        `user`.


        ## Body - Parámetros de entrada


        | Campo | Tipo | Obligatorio | Descripción |

        | --- | --- | --- | --- |

        | tipo | String | Sí | `product_view` o `form_attempt`. |

        | productoId | String | Según el tipo | Obligatorio en una visita y en `product_interest`. |

        | tipoFormulario | String | En form_attempt | `cart`, `quote` o `product_interest`. |
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                tipo: product_view
                productoId: '{{productoId}}'
                tipoFormulario: product_interest
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /:
    get:
      tags:
        - sistema
      summary: Estado del Servidor
      description: |-
