openapi: 3.0.0
info:
  title: CDISFRUTA
  description: >-
    API de CDISFRUTA. En producción el servidor es https://cdisfruta-back.vercel.app y en local http://localhost:5000.
    Las rutas protegidas aceptan la cookie access_token o el header Authorization Bearer.
  version: 1.0.0
servers:
  - url: https://cdisfruta-back.vercel.app
    description: Producción
  - url: http://localhost:5000
    description: Local
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
security:
  - bearerAuth: []
tags:
  - name: auth
    description: Cuentas, sesión y recuperación. Estas peticiones siguen los nombres de la colección local.
  - name: perfil
    description: Datos de la cuenta que inició sesión.
  - name: productos
    description: Catálogo público y administración del catálogo. Escribir exige el permiso `catalog:write`.
  - name: inventario
    description: >-
      Existencias internas. Leer exige `inventory:read` y modificar exige `inventory:write`. Exportar al catálogo es
      solo de administración.
  - name: pedidos
    description: Compras de la tienda, cancelación del cliente y gestión de administración.
  - name: notificaciones
    description: Avisos del panel de administración.
  - name: portada
    description: Diapositivas del carrusel de inicio. Se pueden guardar entre 1 y 12.
  - name: admin
    description: Usuarios, roles, preferencias y analítica. Todo exige rol `admin`, salvo registrar actividad.
  - name: sistema
    description: Comprobación de que el proceso está respondiendo.
paths:
  /api/auth/registro:
    post:
      tags:
        - auth
      summary: Registrar Usuario
      description: >-
        ## Descripción


        Registra un cliente nuevo. El campo `name` se guarda como `nombre`. Valida el esquema, exige aceptar los
        términos, rechaza un correo ya registrado y envía el código de verificación.


        ## Body - Parámetros de entrada


        | Campo | Tipo | Obligatorio | Descripción |

        | --- | --- | --- | --- |

        | name | String | Sí | Nombre del usuario. Mínimo 6 letras. Se guarda en `nombre`. |

        | email | String | Sí | Correo de la cuenta. |

        | password | String | Sí | La contraseña debe tener 8 a 16 caracteres, una mayúscula, una minúscula, un número y
        un símbolo de `.!@#$%^&*`. |

        | terminosAceptados | Boolean | Sí | Debe ser exactamente `true`. |


        ## Respuesta


        `201` con `status: success` y el usuario creado. La cuenta queda sin verificar hasta **Verificar Cuenta**.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                name: Usuario Prueba
                email: usuario@ejemplo.com
                password: Cdisfruta1!
                terminosAceptados: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      security: []
  /api/auth/registro-post-compra:
    post:
      tags:
        - auth
      summary: Registrar Usuario Post Compra
      description: >-
        ## Descripción


        Crea la cuenta después de una compra como invitado y vincula ese pedido. El correo debe coincidir con el del
        envío y el `claimToken` debe seguir vigente.


        ## Body - Parámetros de entrada


        | Campo | Tipo | Obligatorio | Descripción |

        | --- | --- | --- | --- |

        | name | String | Sí | Nombre. Mismas reglas que el registro normal. |

        | email | String | Sí | Debe coincidir con el correo del pedido. |

        | emailConfirmacion | String | Sí | Debe ser igual a `email`. |

        | password | String | Sí | La contraseña debe tener 8 a 16 caracteres, una mayúscula, una minúscula, un número y
        un símbolo de `.!@#$%^&*`. |

        | terminosAceptados | Boolean | Sí | Debe ser `true`. |

        | claimToken | String | Sí | Referencia devuelta al crear el pedido de invitado. Entre 40 y 100 caracteres. |
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                name: Usuario Prueba
                email: comprador@ejemplo.com
                emailConfirmacion: comprador@ejemplo.com
                password: Cdisfruta1!
                terminosAceptados: true
                claimToken: TOKEN_DE_PEDIDO_INVITADO
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      security: []
  /api/auth/reenviar-verificacion-post-compra:
    post:
      tags:
        - auth
      summary: Reenviar Verificación Post Compra
      description: >-
        ## Descripción


        Reenvía el código de verificación de una cuenta creada y todavía no activada. Hay un minuto de espera entre
        envíos.


        ## Body - Parámetros de entrada


        | Campo | Tipo | Obligatorio | Descripción |

        | --- | --- | --- | --- |

        | email | String | Sí | Correo de la cuenta pendiente. |
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                email: comprador@ejemplo.com
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      security: []
  /api/auth/verificar-cuenta:
    post:
      tags:
        - auth
      summary: Verificar Cuenta
      description: |-
        ## Descripción

        Activa la cuenta con el código de 6 dígitos enviado al correo.

        ## Body - Parámetros de entrada

        | Campo | Tipo | Obligatorio | Descripción |
        | --- | --- | --- | --- |
        | email | String | Sí | Correo registrado. |
        | codigo | String | Sí | Código de verificación vigente. |

        ## Respuesta

        `200` cuando el código coincide. `400` si ya estaba verificada o el código no corresponde.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                email: usuario@ejemplo.com
                codigo: '123456'
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      security: []
  /api/auth/login:
    post:
      tags:
        - auth
      summary: Login Usuario
      description: >-
        ## Descripción


        Inicia sesión con correo y contraseña. La cuenta debe estar verificada. La respuesta guarda la cookie
        `access_token` durante 15 minutos.


        ## Body - Parámetros de entrada


        | Campo | Tipo | Obligatorio | Descripción |

        | --- | --- | --- | --- |

        | email | String | Sí | Correo registrado. |

        | password | String | Sí | Contraseña de la cuenta. |


        ## Respuesta


        `200` con `user.nombre`, `email`, `rol`, `permisos`, `telefono` y `avatar`. `403` si falta verificar la cuenta.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                email: usuario@ejemplo.com
                password: Cdisfruta1!
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      security: []
  /api/auth/verificar-token:
    get:
      tags:
        - auth
      summary: Verificar Token
      description: >-
        ## Descripción


        Confirma la sesión y devuelve los datos frescos del usuario, incluido el avatar.


        Requiere la cookie `access_token`. En Postman se guarda sola al ejecutar **Login Usuario** o **Ingreso con
        Google** contra el mismo `{{baseUrl}}`. También se acepta el header `Authorization: Bearer <jwt>`.


        ## Respuesta


        `200` con `valid: true` y `user`. `403` si no hay cookie ni Bearer.
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /api/auth/google:
    post:
      tags:
        - auth
      summary: Ingreso con Google
      description: >-
        ## Descripción


        Crea o recupera la cuenta con la sesión que devuelve el botón de Google y deja la cookie `access_token` por 1
        hora. Si la cuenta ya existía y no estaba verificada, queda verificada.


        ## Body - Parámetros de entrada


        | Campo | Tipo | Obligatorio | Descripción |

        | --- | --- | --- | --- |

        | credential | String | Uno de los dos | ID token del botón Continuar con Google. |

        | code | String | Uno de los dos | Código del flujo anterior `postmessage`. Se puede enviar en lugar de
        `credential`. |
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                credential: ID_TOKEN_DEVUELTO_POR_EL_BOTON_DE_GOOGLE
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      security: []
  /api/auth/codigo-password:
    post:
      tags:
        - auth
      summary: Solicitar Cambio de Contraseña
      description: |-
        ## Descripción

        Envía al correo un enlace para restablecer la contraseña. El enlace vence a los 15 minutos.

        ## Body - Parámetros de entrada

        | Campo | Tipo | Obligatorio | Descripción |
        | --- | --- | --- | --- |
        | email | String | Sí | Correo de una cuenta existente. |
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                email: usuario@ejemplo.com
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      security: []
  /api/auth/reset-password:
    post:
      tags:
        - auth
      summary: Restablecer Contraseña con Token
      description: >-
        ## Descripción


        Cambia la contraseña usando el token del enlace de recuperación. El servidor lo expone como `POST
        /api/auth/reset-password`.


        La contraseña debe tener 8 a 16 caracteres, una mayúscula, una minúscula, un número y un símbolo de `.!@#$%^&*`.


        ## Body - Parámetros de entrada


        | Campo | Tipo | Obligatorio | Descripción |

        | --- | --- | --- | --- |

        | token | String | Sí | Token recibido en el enlace del correo. |

        | nuevaPassword | String | Sí | La contraseña debe tener 8 a 16 caracteres, una mayúscula, una minúscula, un
        número y un símbolo de `.!@#$%^&*`. |
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                token: TOKEN_DEL_ENLACE
                nuevaPassword: NuevaClave1!
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      security: []
  /api/auth/cambiar-password:
    patch:
      tags:
        - auth
      summary: Cambiar Contraseña
      description: >-
        ## Descripción


        Cambia la contraseña de la sesión activa. No usa el token del correo.


        Requiere la cookie `access_token`. En Postman se guarda sola al ejecutar **Login Usuario** o **Ingreso con
        Google** contra el mismo `{{baseUrl}}`. También se acepta el header `Authorization: Bearer <jwt>`.


        La contraseña debe tener 8 a 16 caracteres, una mayúscula, una minúscula, un número y un símbolo de `.!@#$%^&*`.


        ## Body - Parámetros de entrada


        | Campo | Tipo | Obligatorio | Descripción |

        | --- | --- | --- | --- |

        | passActual | String | Sí | Contraseña actual. Si no coincide responde `400`. |

        | nuevaPassword | String | Sí | La contraseña debe tener 8 a 16 caracteres, una mayúscula, una minúscula, un
        número y un símbolo de `.!@#$%^&*`. |
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                passActual: Cdisfruta1!
                nuevaPassword: NuevaClave1!
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /api/logout:
    post:
      tags:
        - auth
      summary: Logout
      description: |-
        ## Descripción

        Cierra la sesión borrando la cookie `access_token`. El servidor solo expone este endpoint como POST.

        ## Respuesta

        `200` con `status: success` y el mensaje `Sesión cerrada`.
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      security: []
  /api/auth/actualizar-perfil:
    patch:
      tags:
        - perfil
      summary: Actualizar Perfil
      description: >-
        ## Descripción


        Actualiza nombre, teléfono y, si se adjunta, la foto. El archivo va en el campo `avatar` (JPG o PNG, hasta 5
        MB).


        Requiere la cookie `access_token`. En Postman se guarda sola al ejecutar **Login Usuario** o **Ingreso con
        Google** contra el mismo `{{baseUrl}}`. También se acepta el header `Authorization: Bearer <jwt>`.


        ## Body - Parámetros de entrada


        | Campo | Tipo | Obligatorio | Descripción |

        | --- | --- | --- | --- |

        | nombre | String | No | Nuevo nombre. |

        | telefono | String | No | Teléfono de contacto. |

        | avatar | Archivo o URL | No | Imagen nueva o URL ya guardada. |
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                nombre:
                  type: string
                  example: Usuario Prueba
                telefono:
                  type: string
                  example: '3001234567'
                avatar:
                  type: string
                  format: binary
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /api/auth/usuario/actualizar-avatar:
    put:
      tags:
        - perfil
      summary: Actualizar Avatar
      description: >-
        ## Descripción


        El controlador espera una imagen en `req.file` y guarda su URL como avatar. La ruta está montada, pero hoy no
        pasa por el middleware de subida: la foto que sí se procesa es la de **Actualizar Perfil**.


        Requiere la cookie `access_token`. En Postman se guarda sola al ejecutar **Login Usuario** o **Ingreso con
        Google** contra el mismo `{{baseUrl}}`. También se acepta el header `Authorization: Bearer <jwt>`.
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /api/get-productos:
    get:
      tags:
        - productos
      summary: Listar Productos de la Tienda
      description: >-
        ## Descripción


        Devuelve los productos activos publicados en la tienda. Si no hay ninguno responde `200` con un arreglo vacío.
        No requiere sesión.
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      security: []
  /api/registro-productos:
    post:
      tags:
        - productos
      summary: Crear Producto
      description: >-
        ## Descripción


        Crea un producto del catálogo y lo publica en la tienda. Las imágenes van en el campo repetible `imagenes` (JPG
        o PNG, máximo 5 archivos y 5 MB cada uno).


        Requiere la cookie `access_token`. En Postman se guarda sola al ejecutar **Login Usuario** o **Ingreso con
        Google** contra el mismo `{{baseUrl}}`. También se acepta el header `Authorization: Bearer <jwt>`. Permiso
        `catalog:write`.


        ## Body - Parámetros de entrada


        | Campo | Tipo | Obligatorio | Descripción |

        | --- | --- | --- | --- |

        | nombre | String | Sí | Nombre comercial. |

        | descripcion | String | Sí | Texto del producto. |

        | precio | Number | Sí | Precio en pesos, sin decimales. |

        | categoria | String | Sí | Categoría del catálogo. |

        | stock | Number | Sí | Existencias iniciales. |

        | imagenes | Archivo | Sí | Al menos una imagen. |
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                nombre:
                  type: string
                  example: Mango deshidratado
                descripcion:
                  type: string
                  example: Snack de mango natural de Ubaté
                precio:
                  type: string
                  example: '12000'
                categoria:
                  type: string
                  example: Fruta deshidratada
                stock:
                  type: string
                  example: '20'
                imagenes:
                  type: string
                  format: binary
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /api/productos/{productoId}:
    put:
      tags:
        - productos
      summary: Actualizar Producto
      description: >-
        ## Descripción


        Reemplaza los datos del producto. `imagenesExistentes` conserva fotos actuales y `imagenes` agrega otras. El
        total se recorta a 5.


        Requiere la cookie `access_token`. En Postman se guarda sola al ejecutar **Login Usuario** o **Ingreso con
        Google** contra el mismo `{{baseUrl}}`. También se acepta el header `Authorization: Bearer <jwt>`. Permiso
        `catalog:write`.


        ## Body - Parámetros de entrada


        | Campo | Tipo | Obligatorio | Descripción |

        | --- | --- | --- | --- |

        | productoId | String | Sí | ID de la URL. Viene en la variable `{{productoId}}`. |

        | nombre | String | Sí | Nombre actualizado. |

        | descripcion | String | Sí | Descripción actualizada. |

        | precio | Number | Sí | Precio en pesos. |

        | categoria | String | Sí | Categoría. |

        | stock | Number | Sí | Existencias. |

        | imagenesExistentes | String o arreglo | No | URLs que deben quedarse. Se puede repetir el campo. |

        | imagenes | Archivo | No | Fotos nuevas. |
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                nombre:
                  type: string
                  example: Mango deshidratado
                descripcion:
                  type: string
                  example: Snack de mango natural de Ubaté
                precio:
                  type: string
                  example: '14000'
                categoria:
                  type: string
                  example: Fruta deshidratada
                stock:
                  type: string
                  example: '18'
                imagenesExistentes:
                  type: string
                  example: https://ejemplo.com/imagen-que-se-conserva.webp
                imagenes:
                  type: string
                  format: binary
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      parameters:
        - name: productoId
          in: path
          required: true
          schema:
            type: string
    delete:
      tags:
        - productos
      summary: Eliminar Producto
      description: >-
        ## Descripción


        Elimina el producto del catálogo y registra una notificación.


        Requiere la cookie `access_token`. En Postman se guarda sola al ejecutar **Login Usuario** o **Ingreso con
        Google** contra el mismo `{{baseUrl}}`. También se acepta el header `Authorization: Bearer <jwt>`. Permiso
        `catalog:write`.
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      parameters:
        - name: productoId
          in: path
          required: true
          schema:
            type: string
  /api/admin/catalogo:
    get:
      tags:
        - productos
      summary: Listar Catálogo Admin
      description: >-
        ## Descripción


        Lista los productos activos que pertenecen al catálogo administrativo, incluidos los que todavía no están en la
        tienda.


        Requiere la cookie `access_token`. En Postman se guarda sola al ejecutar **Login Usuario** o **Ingreso con
        Google** contra el mismo `{{baseUrl}}`. También se acepta el header `Authorization: Bearer <jwt>`. Permiso
        `catalog:read`.
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /api/admin/inventario:
    get:
      tags:
        - inventario
      summary: Listar Inventario
      description: >-
        ## Descripción


        Devuelve los artículos activos del inventario. Una cuenta de logística no recibe el precio.


        Requiere la cookie `access_token`. En Postman se guarda sola al ejecutar **Login Usuario** o **Ingreso con
        Google** contra el mismo `{{baseUrl}}`. También se acepta el header `Authorization: Bearer <jwt>`. Permiso
        `inventory:read`.
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
    post:
      tags:
        - inventario
      summary: Crear Artículo de Inventario
      description: >-
        ## Descripción


        Agrega un artículo que todavía no se publica en la tienda. El precio queda en 0 hasta completarlo en el
        catálogo.


        Requiere la cookie `access_token`. En Postman se guarda sola al ejecutar **Login Usuario** o **Ingreso con
        Google** contra el mismo `{{baseUrl}}`. También se acepta el header `Authorization: Bearer <jwt>`. Permiso
        `inventory:write`.


        ## Body - Parámetros de entrada


        | Campo | Tipo | Obligatorio | Descripción |

        | --- | --- | --- | --- |

        | nombre | String | Sí | Nombre del artículo. |

        | categoria | String | Sí | Tipo de artículo. |

        | stock | Number | Sí | Cantidad entera igual o mayor que cero. |

        | codigoBarras | String | No | Código único. Si se repite responde `409`. |

        | imagenes | Archivo | Sí | Al menos una foto. JPG o PNG. |
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                nombre:
                  type: string
                  example: Mango en bodega
                categoria:
                  type: string
                  example: Fruta deshidratada
                stock:
                  type: string
                  example: '40'
                codigoBarras:
                  type: string
                  example: '7701234567890'
                imagenes:
                  type: string
                  format: binary
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /api/admin/inventario/codigo/{codigoBarras}:
    get:
      tags:
        - inventario
      summary: Consultar por Código de Barras
      description: >-
        ## Descripción


        Busca un artículo activo por su código de barras.


        Requiere la cookie `access_token`. En Postman se guarda sola al ejecutar **Login Usuario** o **Ingreso con
        Google** contra el mismo `{{baseUrl}}`. También se acepta el header `Authorization: Bearer <jwt>`. Permiso
        `inventory:read`.
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      parameters:
        - name: codigoBarras
          in: path
          required: true
          schema:
            type: string
    patch:
      tags:
        - inventario
      summary: Ajustar Stock por Código
      description: >-
        ## Descripción


        Suma o resta existencias usando el código de barras. Un delta negativo no puede dejar el stock por debajo de
        cero.


        Requiere la cookie `access_token`. En Postman se guarda sola al ejecutar **Login Usuario** o **Ingreso con
        Google** contra el mismo `{{baseUrl}}`. También se acepta el header `Authorization: Bearer <jwt>`. Permiso
        `inventory:write`.


        ## Body - Parámetros de entrada


        | Campo | Tipo | Obligatorio | Descripción |

        | --- | --- | --- | --- |

        | delta | Number | Sí | Entero distinto de cero. Positivo entra, negativo sale. |
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                delta: 1
      parameters:
        - name: codigoBarras
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /api/admin/inventario/{productoId}/stock:
    patch:
      tags:
        - inventario
      summary: Ajustar Stock por ID
      description: >-
        ## Descripción


        Fija la cantidad con `stock` o aplica un cambio con `delta`. Envía solo uno de los dos.


        Requiere la cookie `access_token`. En Postman se guarda sola al ejecutar **Login Usuario** o **Ingreso con
        Google** contra el mismo `{{baseUrl}}`. También se acepta el header `Authorization: Bearer <jwt>`. Permiso
        `inventory:write`.


        ## Body - Parámetros de entrada


        | Campo | Tipo | Obligatorio | Descripción |

        | --- | --- | --- | --- |

        | stock | Number | Uno de los dos | Nueva cantidad absoluta, entero mayor o igual que cero. |

        | delta | Number | Uno de los dos | Ajuste entero distinto de cero. |
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                stock: 25
      parameters:
        - name: productoId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /api/admin/inventario/{productoId}/codigo:
    patch:
