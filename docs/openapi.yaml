        | rol | String | Sí | `admin`, `user`, `logistica` o `catalogo`. |

        | permisos | String[] | Sí | Logística: `inventory:read`, `inventory:write`. Catálogo: `catalog:read`,
        `catalog:write`. Admin queda con `*`. Cliente no lleva permisos. |
