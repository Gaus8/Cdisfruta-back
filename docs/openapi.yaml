        cuenta debe ser `admin`.


        ## Body - Parámetros de entrada


        | Campo | Tipo | Obligatorio | Descripción |

        | --- | --- | --- | --- |

        | ids | String[] | Sí | Entre 1 y 10 IDs de clientes. |
      responses:
