  /api/portada:
    get:
      tags:
        - portada
      summary: Obtener Portada
      description: >-
        ## Descripción


        Devuelve las diapositivas ordenadas. Si la colección está vacía, crea las tres diapositivas iniciales. No
        requiere sesión.
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      security: []
  /api/admin/portada:
    put:
      tags:
        - portada
      summary: Guardar Portada
      description: >-
        ## Descripción


        Reemplaza la portada completa. El orden del arreglo es el orden del carrusel. Una diapositiva nueva no lleva
        `_id`; una existente sí, para actualizarla. Las que no vengan en el arreglo se eliminan. La imagen nueva de la
        posición N va en `imagen_N`.


        Requiere la cookie `access_token`. En Postman se guarda sola al ejecutar **Login Usuario** o **Ingreso con
        Google** contra el mismo `{{baseUrl}}`. También se acepta el header `Authorization: Bearer <jwt>`. El rol de la
        cuenta debe ser `admin`.


        ## Body - Parámetros de entrada


        | Campo | Tipo | Obligatorio | Descripción |

        | --- | --- | --- | --- |

        | slides | JSON | Sí | Arreglo de 1 a 12 diapositivas, enviado como texto. |

        | slides[].eyebrow | String | Sí | Frase superior. Máximo 32 caracteres. |

        | slides[].etiqueta | String | Sí | Etiqueta sobre la imagen. Máximo 26. |

        | slides[].titulo | String | Sí | Título. Máximo 64. |

        | slides[].desc | String | Sí | Descripción breve. Máximo 180. |

        | slides[].tag | String | Sí | Texto inferior del cuadro. Máximo 28. |

        | slides[].detalle | String | Sí | Texto de Más información. Máximo 500. |

        | slides[].img | String | Sí | URL actual. Si se adjunta archivo, el servidor usa ese archivo. |

        | slides[].iconKey | String | No | `globe`, `leaf` o `location`. Si falta, queda `leaf`. |

        | imagen_0 | Archivo | No | Foto de la primera diapositiva. Repetir como `imagen_1`, `imagen_2`, etc. JPG, PNG,
        WebP, GIF, AVIF, BMP, TIFF o HEIC, hasta 8 MB. |
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                slides:
                  type: string
                  example: |-
                    [
                      {
                        "_id": "ID_EXISTENTE_O_VACIO",
                        "eyebrow": "Presencia internacional",
                        "etiqueta": "Presencia internacional",
                        "titulo": "CDISFRUTA en Australia",
                        "desc": "Nuestras aromáticas llegando a nuevos destinos.",
                        "tag": "Australia · Melbourne",
                        "detalle": "Texto ampliado que aparece en Más información.",
                        "img": "/img/cdisfruta_01.webp",
                        "iconKey": "globe"
                      }
                    ]
                imagen_0:
                  type: string
                  format: binary
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /api/auth/admin/usuarios:
